<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — Reseller Simulator</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="./icon-192.png" />

      :root { color-scheme: dark; }

        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #123a2d 0%, #07110f 55%, #040908 100%);
        color: #f4f7f5;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 460px; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 22px 0 10px; font-size: clamp(2rem, 8vw, 3rem); line-height: 1; }
      p { margin: 0 0 24px; color: #b9c8c2; line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: #5ee6a8;
        color: #04110c;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #d8fff0; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon-192.png" alt="" width="88" height="88" />
